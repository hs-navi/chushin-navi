<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#eef1f2;font-family:'Noto Sans CJK JP',sans-serif;color:#1d2a33}
.wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:32px}
.card{background:#fff;border-radius:18px;padding:22px;display:grid;gap:14px;justify-items:center}
h2{margin:0;font-size:22px}
p{margin:0;font-size:14px;color:#5a6872;text-align:center;line-height:1.6}
.big{width:180px;height:180px}
.row{display:flex;gap:18px;align-items:flex-end}
.tab{display:flex;align-items:center;gap:8px;background:#dfe3e6;border-radius:8px 8px 0 0;padding:8px 12px;font-size:13px;width:200px}
.tab img{width:16px;height:16px}
.home{display:grid;justify-items:center;gap:4px;font-size:11px}
.home img{width:60px;height:60px;border-radius:14px}
.lbl{font-size:12px;color:#5a6872}
</style></head><body><div class="wrap">
<div class="card"><h2>A 「進」の一文字</h2><img class="big" src="a-shin.svg"><div class="tab"><img src="a-shin.svg">長野県高校進学ナビ</div><div class="row"><div class="home"><img src="a-shin.svg">進学ナビ</div><img src="a-shin.svg" width="32"><img src="a-shin.svg" width="16"></div><p>「進学」「前に進む」の「進」。小さくてもいちばん読み取りやすい案です。</p></div>
<div class="card"><h2>B 長野の山と道</h2><img class="big" src="b-mountain.svg"><div class="tab"><img src="b-mountain.svg">長野県高校進学ナビ</div><div class="row"><div class="home"><img src="b-mountain.svg">進学ナビ</div><img src="b-mountain.svg" width="32"><img src="b-mountain.svg" width="16"></div><p>雪の山並みと、その先へ伸びる道。長野県全体に広げたことが伝わる案です。</p></div>
<div class="card"><h2>C 道しるべ</h2><img class="big" src="c-signpost.svg"><div class="tab"><img src="c-signpost.svg">長野県高校進学ナビ</div><div class="row"><div class="home"><img src="c-signpost.svg">進学ナビ</div><img src="c-signpost.svg" width="32"><img src="c-signpost.svg" width="16"></div><p>青（入試ナビ）と茶（イベントナビ）の2枚の案内板。サイトの2つの機能をそのまま表します。</p></div>
</div></body></html>
