<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#eef1f2;font-family:'Noto Sans CJK JP',sans-serif;color:#1d2a33}
.card{margin:28px;background:#fff;border-radius:18px;padding:26px 32px;display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:center}
.big{width:240px;height:240px}
.side{display:grid;gap:18px}
h2{margin:0;font-size:22px}
.tab{display:flex;align-items:center;gap:8px;background:#dfe3e6;border-radius:8px 8px 0 0;padding:8px 12px;font-size:13px;width:220px}
.tab img{width:16px;height:16px}
.row{display:flex;gap:22px;align-items:flex-end}
.home{display:grid;justify-items:center;gap:4px;font-size:11px}
.home img{width:60px;height:60px;border-radius:14px}
.dark{background:#1d2a33;color:#fff;padding:12px;border-radius:12px;display:flex;gap:16px;align-items:center;font-size:12px}
.lbl{font-size:12px;color:#5a6872}
</style></head><body><div class="card">
<img class="big" src="d-mountain-signpost.svg">
<div class="side"><h2>B＋C 長野の山と道しるべ</h2>
<div class="tab"><img src="d-mountain-signpost.svg">長野県高校進学ナビ</div>
<div class="row"><div class="home"><img src="d-mountain-signpost.svg">進学ナビ</div><div><img src="d-mountain-signpost.svg" width="48"><div class="lbl">48px</div></div><div><img src="d-mountain-signpost.svg" width="32"><div class="lbl">32px</div></div><div><img src="d-mountain-signpost.svg" width="16"><div class="lbl">16px</div></div>
<div class="dark"><img src="d-mountain-signpost.svg" width="40">暗い画面</div></div>
</div></div></body></html>
